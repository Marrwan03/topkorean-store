<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="engineBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pistonMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- ظل المحرك -->
  <rect x="35" y="35" width="130" height="120" rx="15" fill="#000" opacity="0.5" filter="url(#outerShadow)"/>
  
  <!-- بلوك المحرك الرئيسي -->
  <rect x="40" y="40" width="120" height="110" rx="10" fill="url(#engineBlock)" stroke="#030712" stroke-width="3"/>
  
  <!-- رأس المحرك (العلوي) -->
  <rect x="42" y="35" width="116" height="25" rx="6" fill="#374151" stroke="#030712" stroke-width="2.5"/>
  
  <!-- غطاء الصمامات -->
  <rect x="50" y="30" width="100" height="15" rx="5" fill="#4b5563" stroke="#030712" stroke-width="2"/>
  
  <!-- خطوط تفصيلية على بلوك المحرك -->
  <line x1="50" y1="70" x2="150" y2="70" stroke="#030712" stroke-width="1.5" opacity="0.5"/>
  <line x1="50" y1="130" x2="150" y2="130" stroke="#030712" stroke-width="1.5" opacity="0.5"/>
  
  <!-- مسامير على رأس المحرك -->
  <g fill="#9ca3af" stroke="#1f2937" stroke-width="1">
    <circle cx="60" cy="48" r="3"/>
    <circle cx="80" cy="48" r="3"/>
    <circle cx="100" cy="48" r="3"/>
    <circle cx="120" cy="48" r="3"/>
    <circle cx="140" cy="48" r="3"/>
  </g>
  
  <!-- المكابس (الاسطوانات) -->
  <g>
    <!-- مكبس 1 -->
    <rect x="58" y="85" width="16" height="50" rx="3" fill="url(#pistonMetal)" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="61" y="120" width="10" height="15" rx="2" fill="#111827"/>
    
    <!-- مكبس 2 -->
    <rect x="92" y="85" width="16" height="50" rx="3" fill="url(#pistonMetal)" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="95" y="120" width="10" height="15" rx="2" fill="#111827"/>
    
    <!-- مكبس 3 -->
    <rect x="126" y="85" width="16" height="50" rx="3" fill="url(#pistonMetal)" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="129" y="120" width="10" height="15" rx="2" fill="#111827"/>
  </g>
  
  <!-- قضبان التوصيل -->
  <g stroke="#9ca3af" stroke-width="4" stroke-linecap="round">
    <line x1="66" y1="135" x2="66" y2="145"/>
    <line x1="100" y1="135" x2="100" y2="145"/>
    <line x1="134" y1="135" x2="134" y2="145"/>
  </g>
  
  <!-- العمود المرفقي (كروس) -->
  <rect x="52" y="142" width="96" height="12" rx="4" fill="#1f2937" stroke="#9ca3af" stroke-width="1.5"/>
  
  <!-- حزام التوقيت / سير -->
  <path d="M45,75 Q30,75 30,95 Q30,115 45,115 L50,115 L50,75 Z" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <circle cx="38" cy="95" r="8" fill="#4b5563" stroke="#030712" stroke-width="1.5"/>
  
  <!-- Highlight -->
  <rect x="45" y="45" width="8" height="100" rx="4" fill="url(#highlight)" opacity="0.3"/>
  
  <!-- النص التقني -->
  <g opacity="0.25">
    <text x="100" y="165" font-family="'Courier New', monospace" font-size="9" fill="#fff" text-anchor="middle" letter-spacing="2">V6</text>
    <text x="100" y="183" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="5">محركات</text>
    <text x="100" y="197" font-family="'Courier New', monospace" font-size="8" fill="#fff" text-anchor="middle" letter-spacing="3">TORQUE</text>
  </g>
</svg>