<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="radiatorCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coolantBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.6" />
    </linearGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="fanCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- ظل الردياتير -->
  <rect x="35" y="30" width="130" height="130" rx="10" fill="#000" opacity="0.4" filter="url(#outerShadow)"/>
  
  <!-- جسم الردياتير الخارجي -->
  <rect x="40" y="35" width="120" height="120" rx="8" fill="#1f2937" stroke="#030712" stroke-width="2.5"/>
  
  <!-- قلب الردياتير (المشع) -->
  <rect x="50" y="45" width="100" height="100" rx="4" fill="url(#radiatorCore)" stroke="#030712" stroke-width="1.5"/>
  
  <!-- خطوط التبريد العمودية -->
  <g stroke="#374151" stroke-width="1.5" opacity="0.6">
    <line x1="60" y1="48" x2="60" y2="142"/>
    <line x1="70" y1="48" x2="70" y2="142"/>
    <line x1="80" y1="48" x2="80" y2="142"/>
    <line x1="90" y1="48" x2="90" y2="142"/>
    <line x1="100" y1="48" x2="100" y2="142"/>
    <line x1="110" y1="48" x2="110" y2="142"/>
    <line x1="120" y1="48" x2="120" y2="142"/>
    <line x1="130" y1="48" x2="130" y2="142"/>
    <line x1="140" y1="48" x2="140" y2="142"/>
  </g>
  
  <!-- خطوط الأفقية -->
  <g stroke="#4b5563" stroke-width="1" opacity="0.4">
    <line x1="52" y1="65" x2="148" y2="65"/>
    <line x1="52" y1="85" x2="148" y2="85"/>
    <line x1="52" y1="105" x2="148" y2="105"/>
    <line x1="52" y1="125" x2="148" y2="125"/>
  </g>
  
  <!-- سائل التبريد (الجزء السفلي من الردياتير) -->
  <rect x="50" y="115" width="100" height="30" rx="0" fill="url(#coolantBlue)" opacity="0.5"/>
  
  <!-- خزان السائل الجانبي -->
  <rect x="152" y="55" width="12" height="70" rx="4" fill="#111827" stroke="#030712" stroke-width="1.5"/>
  <rect x="155" y="60" width="6" height="40" rx="2" fill="#3b82f6" opacity="0.6"/>
  
  <!-- المشعب العلوي -->
  <rect x="40" y="30" width="120" height="15" rx="5" fill="#374151" stroke="#030712" stroke-width="2"/>
  
  <!-- المشعب السفلي -->
  <rect x="40" y="145" width="120" height="15" rx="5" fill="#374151" stroke="#030712" stroke-width="2"/>
  
  <!-- المروحة (دائرية) -->
  <circle cx="100" cy="95" r="35" fill="#111827" stroke="#030712" stroke-width="2" filter="url(#outerShadow)"/>
  
  <!-- ريش المروحة -->
  <g fill="url(#fanBlade)" stroke="#030712" stroke-width="1">
    <path d="M100,60 Q120,60 130,75 Q110,70 100,95 Z"/>
    <path d="M100,60 Q80,60 70,75 Q90,70 100,95 Z"/>
    <path d="M140,95 Q140,115 125,125 Q130,105 100,95 Z"/>
    <path d="M60,95 Q60,115 75,125 Q70,105 100,95 Z"/>
    <path d="M125,70 Q140,85 140,95 Q120,85 100,95 Z"/>
    <path d="M75,70 Q60,85 60,95 Q80,85 100,95 Z"/>
  </g>
  
  <!-- مركز المروحة -->
  <circle cx="100" cy="95" r="10" fill="url(#fanCenter)" stroke="#030712" stroke-width="1.5"/>
  <circle cx="100" cy="95" r="4" fill="#111827"/>
  
  <!-- Highlight -->
  <rect x="45" y="40" width="6" height="110" rx="3" fill="#ffffff" opacity="0.1"/>
  
  <!-- النص التقني -->
  <g opacity="0.25">
    <text x="100" y="170" font-family="'Courier New', monospace" font-size="9" fill="#fff" text-anchor="middle" letter-spacing="3">TEMP</text>
    <text x="100" y="188" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="5">تبريد</text>
    <text x="100" y="198" font-family="Arial" font-size="6" fill="#fff" text-anchor="middle">°C</text>
  </g>
</svg>