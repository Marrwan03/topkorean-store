<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plasticCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rubberSeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  <rect x="40" y="25" width="120" height="140" rx="20" fill="#000" opacity="0.4" filter="url(#outerShadow)"/>
  <rect x="45" y="25" width="110" height="140" rx="15" fill="url(#metalBody)" stroke="#030712" stroke-width="3"/>
  <rect x="38" y="22" width="124" height="28" rx="10" fill="url(#plasticCap)" stroke="#030712" stroke-width="3"/>
  
  <g fill="#111827">
    <rect x="45" y="28" width="8" height="16" rx="2" />
    <rect x="58" y="28" width="8" height="16" rx="2" />
    <rect x="71" y="28" width="8" height="16" rx="2" />
    <rect x="84" y="28" width="8" height="16" rx="2" />
    <rect x="97" y="28" width="8" height="16" rx="2" />
    <rect x="110" y="28" width="8" height="16" rx="2" />
    <rect x="123" y="28" width="8" height="16" rx="2" />
    <rect x="136" y="28" width="8" height="16" rx="2" />
    <rect x="149" y="28" width="8" height="16" rx="2" />
  </g>

  <rect x="38" y="140" width="124" height="30" rx="10" fill="url(#plasticCap)" stroke="#030712" stroke-width="3"/>
  <rect x="42" y="150" width="116" height="8" rx="4" fill="url(#rubberSeal)"/>

  <rect x="45" y="60" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="61" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="72" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="73" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="84" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="85" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="96" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="97" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="108" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="109" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="120" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="121" width="108" height="1" fill="#9ca3af" opacity="0.5"/>
  <rect x="45" y="132" width="110" height="6" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="46" y="133" width="108" height="1" fill="#9ca3af" opacity="0.5"/>

  <line x1="45" y1="50" x2="45" y2="140" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>
  <line x1="155" y1="50" x2="155" y2="140" stroke="#4b5563" stroke-width="4" stroke-linecap="round"/>

  <rect x="48" y="30" width="15" height="135" rx="7" fill="url(#highlight)" opacity="0.4"/>
  <rect x="148" y="35" width="4" height="120" rx="2" fill="#ffffff" opacity="0.2"/>
  <ellipse cx="100" cy="24" rx="30" ry="4" fill="#ffffff" opacity="0.3"/>

  <!-- ========== خط تقني / رياضي ========== -->
  <g opacity="0.25">
    <!-- زيت -->
    <text x="100" y="55" font-family="'Courier New', 'Monaco', monospace" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="4">زيت</text>
    <!-- فلتر -->
    <text x="100" y="85" font-family="'Courier New', 'Monaco', monospace" font-size="24" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="6">فلتر</text>
    <!-- أداء عالي -->
    <text x="100" y="115" font-family="'Courier New', 'Monaco', monospace" font-size="10" fill="#fff" text-anchor="middle" letter-spacing="2">أداء عالي</text>
    
    <line x1="65" y1="125" x2="135" y2="125" stroke="#fff" stroke-width="1"/>
    <circle cx="100" cy="135" r="4" fill="none" stroke="#fff" stroke-width="1"/>
    <text x="100" y="138" font-family="Arial, sans-serif" font-size="5" fill="#fff" text-anchor="middle" font-weight="bold">®</text>
  </g>

  <rect x="50" y="32" width="100" height="14" rx="5" fill="none" stroke="#030712" stroke-width="2" opacity="0.6"/>
  <rect x="50" y="145" width="100" height="14" rx="5" fill="none" stroke="#030712" stroke-width="2" opacity="0.6"/>
