<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="brakeDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="caliperRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#991b1b;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#450a0a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="discCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </radialGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- الظل -->
  <circle cx="100" cy="105" r="68" fill="#000" opacity="0.4" filter="url(#outerShadow)"/>
  
  <!-- قرص الفرامل -->
  <circle cx="100" cy="100" r="65" fill="url(#brakeDisc)" stroke="#030712" stroke-width="3"/>
  
  <!-- خطوط التهوية على القرص -->
  <g stroke="#374151" stroke-width="2" opacity="0.6">
    <line x1="100" y1="35" x2="100" y2="45"/>
    <line x1="100" y1="155" x2="100" y2="165"/>
    <line x1="35" y1="100" x2="45" y2="100"/>
    <line x1="155" y1="100" x2="165" y2="100"/>
    <line x1="55" y1="55" x2="62" y2="62"/>
    <line x1="138" y1="138" x2="145" y2="145"/>
    <line x1="55" y1="145" x2="62" y2="138"/>
    <line x1="138" y1="62" x2="145" y2="55"/>
  </g>
  
  <!-- حفر/نقاط على القرص -->
  <g fill="#1f2937" opacity="0.4">
    <circle cx="100" cy="60" r="2"/>
    <circle cx="100" cy="140" r="2"/>
    <circle cx="60" cy="100" r="2"/>
    <circle cx="140" cy="100" r="2"/>
    <circle cx="72" cy="72" r="2"/>
    <circle cx="128" cy="128" r="2"/>
    <circle cx="72" cy="128" r="2"/>
    <circle cx="128" cy="72" r="2"/>
  </g>
  
  <!-- مركز القرص (hub) -->
  <circle cx="100" cy="100" r="25" fill="url(#discCenter)" stroke="#030712" stroke-width="2"/>
  
  <!-- مسامير المركز -->
  <g fill="#9ca3af" stroke="#1f2937" stroke-width="1.5">
    <circle cx="100" cy="80" r="4"/>
    <circle cx="100" cy="120" r="4"/>
    <circle cx="80" cy="100" r="4"/>
    <circle cx="120" cy="100" r="4"/>
    <circle cx="86" cy="86" r="4"/>
    <circle cx="114" cy="114" r="4"/>
    <circle cx="86" cy="114" r="4"/>
    <circle cx="114" cy="86" r="4"/>
  </g>
  
  <!-- الكاليبر (أحمر) -->
  <path d="M135,70 Q155,70 155,90 L155,110 Q155,130 135,130 L120,130 L120,70 Z" fill="url(#caliperRed)" stroke="#030712" stroke-width="2.5" filter="url(#outerShadow)"/>
  
  <!-- تفاصيل الكاليبر -->
  <rect x="130" y="85" width="18" height="6" rx="2" fill="#450a0a" opacity="0.7"/>
  <rect x="130" y="105" width="18" height="6" rx="2" fill="#450a0a" opacity="0.7"/>
  <line x1="125" y1="100" x2="135" y2="100" stroke="#fca5a5" stroke-width="2" opacity="0.6"/>
  
  <!-- فحمات الفرامل -->
  <rect x="115" y="82" width="10" height="36" rx="3" fill="#1f2937" stroke="#9ca3af" stroke-width="1"/>
  
  <!-- Highlight -->
  <ellipse cx="85" cy="85" rx="30" ry="30" fill="#ffffff" opacity="0.08"/>
  
  <!-- النص -->
  <g opacity="0.25">
    <text x="100" y="42" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="4">STOP</text>
    <text x="100" y="172" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="5">فرامل</text>
    <text x="100" y="190" font-family="'Courier New', monospace" font-size="9" fill="#fff" text-anchor="middle" letter-spacing="3">POWER STOP</text>
  </g>
</svg>