<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="bumperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="25%" style="stop-color:#6b7280"/>
      <stop offset="50%" style="stop-color:#9ca3af"/>
      <stop offset="75%" style="stop-color:#374151"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="grilleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#030712"/>
      <stop offset="100%" style="stop-color:#1f2937"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9fafb"/>
      <stop offset="40%" style="stop-color:#d1d5db"/>
      <stop offset="100%" style="stop-color:#6b7280"/>
    </linearGradient>
    <radialGradient id="fogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#fef08a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0"/>
    </radialGradient>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bg)"/>
  
  <!-- ظل الصدام -->
  <rect x="20" y="48" width="160" height="98" rx="15" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  
  <!-- الصدام الرئيسي -->
  <rect x="23" y="51" width="154" height="92" rx="14" fill="url(#bumperGrad)" stroke="#030712" stroke-width="2.5"/>
  
  <!-- شريط كروم علوي -->
  <rect x="28" y="51" width="144" height="8" rx="4" fill="url(#chromeGrad)" stroke="#030712" stroke-width="1.5"/>
  
  <!-- لمبات LED جانبية مع إضاءة -->
  <rect x="32" y="64" width="20" height="10" rx="3" fill="url(#ledGlow)" stroke="#030712" stroke-width="1" filter="url(#glowFilter)"/>
  <text x="42" y="72" font-family="Arial" font-size="6" fill="#1f2937" text-anchor="middle" font-weight="bold">LED</text>
  
  <rect x="148" y="64" width="20" height="10" rx="3" fill="url(#ledGlow)" stroke="#030712" stroke-width="1" filter="url(#glowFilter)"/>
  <text x="158" y="72" font-family="Arial" font-size="6" fill="#1f2937" text-anchor="middle" font-weight="bold">LED</text>
  
  <!-- شبكة كبيرة جريئة -->
  <rect x="55" y="60" width="90" height="52" rx="10" fill="url(#grilleGrad)" stroke="url(#chromeGrad)" stroke-width="3"/>
  
  <!-- تفاصيل الشبكة (شبك سداسي - خطوط أفقية وعمودية) -->
  <g stroke="#4b5563" stroke-width="1.5" opacity="0.8">
    <line x1="60" y1="68" x2="140" y2="68"/>
    <line x1="60" y1="76" x2="140" y2="76"/>
    <line x1="60" y1="84" x2="140" y2="84"/>
    <line x1="60" y1="92" x2="140" y2="92"/>
    <line x1="60" y1="100" x2="140" y2="100"/>
  </g>
  <g stroke="#374151" stroke-width="1" opacity="0.5">
    <line x1="72" y1="64" x2="72" y2="108"/>
    <line x1="84" y1="64" x2="84" y2="108"/>
    <line x1="96" y1="64" x2="96" y2="108"/>
    <line x1="108" y1="64" x2="108" y2="108"/>
    <line x1="120" y1="64" x2="120" y2="108"/>
    <line x1="132" y1="64" x2="132" y2="108"/>
  </g>
  
  <!-- شعار السيارة -->
  <circle cx="100" cy="86" r="11" fill="url(#chromeGrad)" stroke="#030712" stroke-width="1.5"/>
  <text x="100" y="92" font-family="Arial" font-size="14" font-weight="900" fill="#1f2937" text-anchor="middle">K</text>
  
  <!-- كشافات الضباب (يسار) -->
  <circle cx="48" cy="116" r="12" fill="#111827" stroke="url(#chromeGrad)" stroke-width="2"/>
  <circle cx="48" cy="116" r="7" fill="url(#fogGlow)" filter="url(#glowFilter)"/>
  
  <!-- كشافات الضباب (يمين) -->
  <circle cx="152" cy="116" r="12" fill="#111827" stroke="url(#chromeGrad)" stroke-width="2"/>
  <circle cx="152" cy="116" r="7" fill="url(#fogGlow)" filter="url(#glowFilter)"/>
  
  <!-- فتحات سفلية -->
  <rect x="38" y="128" width="124" height="12" rx="5" fill="#030712" stroke="url(#chromeGrad)" stroke-width="1.5"/>
  <line x1="42" y1="133" x2="158" y2="133" stroke="#4b5563" stroke-width="1" opacity="0.6"/>
  
  <!-- Highlight على الصدام -->
  <rect x="26" y="54" width="5" height="86" rx="2.5" fill="#ffffff" opacity="0.12"/>
  
  <!-- مسامير تثبيت -->
  <circle cx="36" cy="55" r="2.5" fill="#9ca3af" stroke="#030712" stroke-width="0.8"/>
  <circle cx="164" cy="55" r="2.5" fill="#9ca3af" stroke="#030712" stroke-width="0.8"/>
  
  <!-- النص التقني -->
  <g filter="url(#textShadow)">
    <text x="100" y="160" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#fcd34d" text-anchor="middle" letter-spacing="5">BODY</text>
    <text x="100" y="182" font-family="'Courier New', monospace" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="7">هيكل</text>
    <text x="100" y="198" font-family="'Courier New', monospace" font-size="8" fill="#9ca3af" text-anchor="middle" letter-spacing="4">SPORT</text>
  </g>
</svg>