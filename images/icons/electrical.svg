<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="batteryBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="terminalBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- ظل البطارية -->
  <rect x="55" y="45" width="90" height="100" rx="12" fill="#000" opacity="0.5" filter="url(#outerShadow)"/>
  
  <!-- جسم البطارية الرئيسي -->
  <rect x="58" y="48" width="84" height="95" rx="8" fill="url(#batteryBody)" stroke="#030712" stroke-width="2.5"/>
  
  <!-- أعلى البطارية (غطاء بلاستيكي) -->
  <rect x="55" y="42" width="90" height="20" rx="6" fill="#111827" stroke="#030712" stroke-width="2.5"/>
  
  <!-- الأقطاب + أحمر (موجب) -->
  <rect x="75" y="30" width="14" height="18" rx="3" fill="url(#terminalRed)" stroke="#450a0a" stroke-width="1.5"/>
  <text x="82" y="43" font-family="Arial" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">+</text>
  
  <!-- الأقطاب - أسود (سالب) -->
  <rect x="110" y="30" width="14" height="18" rx="3" fill="url(#terminalBlack)" stroke="#030712" stroke-width="1.5"/>
  <text x="117" y="43" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">-</text>
  
  <!-- شريط أحمر على البطارية -->
  <rect x="58" y="70" width="84" height="8" rx="2" fill="#dc2626" opacity="0.7"/>
  
  <!-- ملصق البطارية -->
  <rect x="68" y="85" width="64" height="40" rx="4" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  <text x="100" y="100" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">12V</text>
  <text x="100" y="115" font-family="'Courier New', monospace" font-size="7" fill="#9ca3af" text-anchor="middle">70Ah</text>
  
  <!-- سلك موجب (أحمر) -->
  <path d="M82,48 Q70,35 60,50 Q50,65 40,55" stroke="#dc2626" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- سلك سالب (أسود) -->
  <path d="M117,48 Q130,30 145,45 Q155,55 160,70" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- شرارة كهربائية صغيرة -->
  <g filter="url(#glow)">
    <line x1="38" y1="53" x2="32" y2="48" stroke="#fbbf24" stroke-width="2"/>
    <line x1="35" y1="56" x2="28" y2="53" stroke="#fcd34d" stroke-width="1.5"/>
    <circle cx="30" cy="48" r="3" fill="#fef08a" opacity="0.8"/>
  </g>
  
  <!-- Highlights -->
  <rect x="60" y="50" width="6" height="90" rx="3" fill="#ffffff" opacity="0.12"/>
  <rect x="135" y="55" width="3" height="80" rx="1.5" fill="#ffffff" opacity="0.08"/>
  
  <!-- النص التقني -->
  <g opacity="0.25">
    <text x="100" y="155" font-family="'Courier New', monospace" font-size="9" fill="#fff" text-anchor="middle" letter-spacing="2">POWER</text>
    <text x="100" y="175" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#fff" text-anchor="middle" letter-spacing="5">كهرباء</text>
    <circle cx="100" cy="185" r="2" fill="#fff" opacity="0.5"/>
    <text x="100" y="193" font-family="Arial" font-size="6" fill="#fff" text-anchor="middle">VOLTAGE</text>
  </g>
</svg>