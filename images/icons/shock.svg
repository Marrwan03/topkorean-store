<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <linearGradient id="metalTube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="springMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#030712;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1f2937;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pistonRod" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- الظل -->
  <rect x="70" y="25" width="60" height="150" rx="10" fill="#000" opacity="0.4" filter="url(#outerShadow)"/>
  
  <!-- الأنبوب الرئيسي -->
  <rect x="75" y="30" width="50" height="140" rx="8" fill="url(#metalTube)" stroke="#030712" stroke-width="2.5"/>
  
  <!-- الزنبرك (الحلزوني) بلون ذهبي نحاسي -->
  <g stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M80,40 L120,48 L80,56 L120,64 L80,72 L120,80 L80,88 L120,96 L80,104 L120,112 L80,120 L120,128 L80,136 L120,144 L80,152 L120,160"/>
  </g>
  
  <!-- طرف علوي -->
  <rect x="65" y="22" width="70" height="15" rx="5" fill="url(#metalTube)" stroke="#030712" stroke-width="2.5"/>
  <circle cx="100" cy="30" r="6" fill="#111827" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- طرف سفلي -->
  <rect x="65" y="163" width="70" height="15" rx="5" fill="url(#metalTube)" stroke="#030712" stroke-width="2.5"/>
  <circle cx="100" cy="170" r="6" fill="#111827" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- العمود الداخلي -->
  <rect x="90" y="35" width="20" height="130" rx="4" fill="url(#pistonRod)"/>
  
  <!-- غطاء الحماية -->
  <path d="M85,50 L80,80 Q75,95 80,110 L85,140" stroke="#374151" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M115,50 L120,80 Q125,95 120,110 L115,140" stroke="#374151" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- اللمعات -->
  <rect x="78" y="32" width="8" height="135" rx="4" fill="url(#highlight)" opacity="0.3"/>
  <rect x="115" y="35" width="3" height="130" rx="1.5" fill="#ffffff" opacity="0.15"/>
  
  <!-- النص التقني - محسّن مع خلفية شفافة ونص أبيض لامع -->
  <g filter="url(#textShadow)">
    <text x="100" y="48" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="4">SHOCK</text>
    <text x="100" y="78" font-family="'Courier New', monospace" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">مساعدات</text>
    <text x="100" y="105" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ثبات &amp; راحة</text>
    <text x="100" y="135" font-family="'Courier New', monospace" font-size="10" fill="#fcd34d" text-anchor="middle" letter-spacing="4">SPORT</text>
  </g>
  
  <line x1="65" y1="148" x2="135" y2="148" stroke="#fef08a" stroke-width="1" opacity="0.4"/>
  <text x="100" y="158" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#9ca3af" text-anchor="middle" letter-spacing="2">ADVANCED</text>
</svg>