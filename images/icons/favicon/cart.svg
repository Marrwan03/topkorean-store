<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- عربة التسوق -->
  <path d="M30,50 L50,50 L60,90 L140,90 L150,50 L70,50" fill="none" stroke="#ffc107" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M50,50 L55,35 L65,35 L70,50" fill="#1a472a" stroke="#ffc107" stroke-width="2"/>
  
  <!-- جسم العربة -->
  <rect x="55" y="85" width="90" height="50" rx="8" fill="#1a472a" stroke="#ffc107" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- عجلات -->
  <circle cx="75" cy="145" r="16" fill="#1f2937" stroke="#ffc107" stroke-width="3"/>
  <circle cx="125" cy="145" r="16" fill="#1f2937" stroke="#ffc107" stroke-width="3"/>
  <circle cx="75" cy="145" r="6" fill="#9ca3af"/>
  <circle cx="125" cy="145" r="6" fill="#9ca3af"/>
  
  <!-- تفاصيل العربة -->
  <line x1="75" y1="95" x2="75" y2="125" stroke="#ffc107" stroke-width="2" opacity="0.5"/>
  <line x1="100" y1="95" x2="100" y2="125" stroke="#ffc107" stroke-width="2" opacity="0.5"/>
  <line x1="125" y1="95" x2="125" y2="125" stroke="#ffc107" stroke-width="2" opacity="0.5"/>
</svg>