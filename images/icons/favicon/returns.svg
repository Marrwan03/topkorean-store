<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- سهم رجوع دائري -->
  <path d="M120,50 A65,65 0 1,1 55,70" fill="none" stroke="#ffc107" stroke-width="6" stroke-linecap="round" filter="url(#shadow)"/>
  <polygon points="50,65 65,55 60,75" fill="#ffc107"/>
  
  <!-- صندوق -->
  <rect x="55" y="100" width="90" height="55" rx="6" fill="#1a472a" stroke="#f8f9fa" stroke-width="2.5"/>
  <path d="M55,100 L100,115 L145,100" fill="none" stroke="#ffc107" stroke-width="3"/>
  <rect x="75" y="120" width="50" height="20" rx="3" fill="#9ca3af" opacity="0.6"/>
  
  <!-- علامة استرجاع -->
  <text x="100" y="175" font-size="12" fill="#ffc107" text-anchor="middle" font-family="Arial" font-weight="bold">↺</text>
</svg>