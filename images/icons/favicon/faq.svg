<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- فقاعة حوار -->
  <rect x="35" y="45" width="130" height="100" rx="20" fill="#1a472a" stroke="#ffc107" stroke-width="3" filter="url(#shadow)"/>
  <polygon points="60,145 75,170 90,145" fill="#1a472a" stroke="#ffc107" stroke-width="2"/>
  
  <!-- علامة استفهام -->
  <circle cx="100" cy="80" r="25" fill="#ffc107"/>
  <text x="100" y="92" font-size="30" fill="#1a472a" text-anchor="middle" font-weight="bold">؟</text>
  
  <!-- خطوط -->
  <line x1="60" y1="115" x2="140" y2="115" stroke="#f8f9fa" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="128" x2="120" y2="128" stroke="#f8f9fa" stroke-width="2" opacity="0.3"/>
</svg>