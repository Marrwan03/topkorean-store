<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a472a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- دائرة خارجية -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#checkGrad)" stroke-width="6" filter="url(#shadow)"/>
  
  <!-- علامة صح -->
  <polyline points="65,100 90,125 135,75" fill="none" stroke="#ffc107" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- نقاط زخرفية -->
  <circle cx="50" cy="60" r="3" fill="#ffc107" opacity="0.5"/>
  <circle cx="150" cy="60" r="3" fill="#ffc107" opacity="0.5"/>
  <circle cx="50" cy="140" r="3" fill="#ffc107" opacity="0.5"/>
  <circle cx="150" cy="140" r="3" fill="#ffc107" opacity="0.5"/>
</svg>