<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- درع -->
  <path d="M100,30 L155,50 L155,100 Q155,140 100,170 Q45,140 45,100 L45,50 Z" fill="#1a472a" stroke="#ffc107" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- علامة صح داخل الدرع -->
  <polyline points="75,100 95,120 130,80" fill="none" stroke="#ffc107" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- خطوط نصية (تمثل بنود) -->
  <line x1="60" y1="130" x2="140" y2="130" stroke="#f8f9fa" stroke-width="2" opacity="0.5"/>
  <line x1="60" y1="142" x2="120" y2="142" stroke="#f8f9fa" stroke-width="2" opacity="0.3"/>
</svg>