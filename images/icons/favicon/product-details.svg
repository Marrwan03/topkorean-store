<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#bgGlow)"/>
  
  <!-- قطعة سيارة -->
  <rect x="45" y="55" width="80" height="60" rx="10" fill="#1a472a" stroke="#ffc107" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="70" cy="85" r="8" fill="#9ca3af" stroke="#030712" stroke-width="2"/>
  <circle cx="100" cy="85" r="8" fill="#9ca3af" stroke="#030712" stroke-width="2"/>
  
  <!-- عدسة تكبير -->
  <circle cx="135" cy="120" r="25" fill="none" stroke="#ffc107" stroke-width="5"/>
  <line x1="153" y1="138" x2="170" y2="155" stroke="#ffc107" stroke-width="5" stroke-linecap="round"/>
  
  <!-- علامة تفاصيل -->
  <circle cx="95" cy="75" r="3" fill="#ffc107"/>
  <circle cx="95" cy="95" r="3" fill="#ffc107"/>
</svg>